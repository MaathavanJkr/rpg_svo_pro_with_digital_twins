# FYP Phase 10 initial-alignment robustness, M3 (primary arm), EuRoC V1. Identical to euroc_v1_m3_d4.yaml (heuristic
# information) except, for this experiment only and identically for both methods: rotation limit 5 -> 30 deg,
# translation limit 0.75 -> 2.0 m.
# FYP Phase 10 D4 ablation config for M3 (online_registration_m3.py), EuRoC V1: identical to euroc_v1_m3.yaml plus the information
# convention and the calibrated-Hessian factors for DF (two-factor definition in docs/phase10_d4_realism.md,
# fitted on V1_01 ONLY from the Phase 9 M2 keyframes, runs/phase10_d4/calibration.json). The arm is selected per run
# with the launch argument information:=heuristic|hessian|hessian_calibrated (overrides 'information' below).
# FYP M3: registration settings for EuRoC Vicon Room 1 with the distance-field registration
# (online_registration_m3.py, registration_method: distance_field). All M2 values below are copied
# unchanged from euroc_v1.yaml (same validity thresholds, same information heuristic and scale factors),
# so M2 and M3 differ only in the registration step. Phase 8 configuration fixed after Phase 7:
# unsigned, untruncated grid, v = 0.05 m, Huber delta = 0.05 m, LM, 100-iteration cap.
registration_settings:
  # Weights of the heuristic information matrix: kept equal to Oerlikon so that only the
  # geometry-dependent thresholds change in the port. Their absolute effect on the backend is a
  # tuning question for later ablations, not part of the port. [9, 2, 1]
  scale_factor_position: 9
  scale_factor_rotation: 2
  information_matrix_power: 1

  # ICP correspondence radius. M1 (VIO only) map-frame error on V1_01 after the D1 alignment:
  # median ~0.22 m, max 0.44-0.46 m (5 runs). The radius must cover that misalignment plus landmark
  # noise, while staying well below the room size so that fitness stays informative (at 8 m every
  # landmark in the room would count as an inlier; Phase 3 note 5a). [8 m]
  max_correspondence_distance: 0.5

  # Accept only if the inlier RMSE is small: good registrations of SVO landmarks against planar
  # walls should leave mostly landmark noise (few cm to ~0.1 m for mono depth). 0.15 m is 30 % of
  # the correspondence radius (Oerlikon: 1.6 / 8 = 20 %). [1.6 m]
  inliers_rmse_thr: 0.15

  # Fraction of landmarks with a correspondence within 0.5 m. Kept at the original value; it is now
  # meaningful because the radius is room scale. [0.75 hard-coded]
  fitness_threshold: 0.75

  # Plausibility limits on the ICP correction (the VIO is assumed "close"). Translation: 0.75 m,
  # about 1.6x the largest M1 map-frame error seen; a larger correction than the correspondence
  # radius can hardly be a converged solution. Rotation: 5 deg covers the D1 yaw uncertainty
  # (~2 deg GT-orientation effect, docs/phase4_m1.md) plus VIO yaw drift over V1_01 (~1-2 deg).
  # [20 m, 15 deg]
  max_translation_distance: 2.0  # Phase 10 alignment robustness (was 0.75)
  max_rotation_distance: 30  # Phase 10 alignment robustness (was 5)

  # Box around the current body position used to crop the local cloud and the twin. 10 m keeps the
  # whole room (no crop); the cropping exists for city-scale maps. [350 m]
  size_bounding_box: 10

  # Twin handling. The twin is preprocessed once offline (dataset/derived/euroc_twin/V1_leica_v30mm.ply:
  # crop, 3 cm voxels, normals; decision D3), so the node must not downsample it again (original:
  # 1 m voxels, far too coarse for a room) and must keep the floor (original drops z < 0; the
  # V1 floor lies at z = -0.14 ... 0).
  twin_voxel_size: 0
  twin_min_z: null

  # M3 (Phase 8). The grid file is passed with --df-grid (launch arg df_grid):
  # dataset/derived/euroc_twin/df/V1_leica_v30mm_udf_v50mm.bin, built by analysis/df_grid.py from the
  # twin above. The node verifies the grid header (format, size, FNV-1a checksum) and that both the grid's
  # twin md5 and the md5 of --reference-map equal df_twin_md5.
  registration_method: distance_field   # point_to_plane = M2 path
  df_twin_md5: 8fc20009837a56090259b9c5da31724c
  df_huber_delta: 0.05
  df_max_iter: 100
  df_information: heuristic             # hessian = D4 ablation

  # Phase 10 D4 (information convention; calibrated = S H S, S = diag(1/info_k_p I3, 1/info_k_r I3); H = Hessian
  # re-expressed about the body pose, factors refitted on V1_01 after the D4 deviation of 2026-10-25, see docs/PLAN.md)
  information: heuristic
  info_k_p: 8.179009316257916
  info_k_r: 1.404404569564741
